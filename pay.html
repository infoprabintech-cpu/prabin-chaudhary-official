<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>भुक्तानी विवरण | QR Codes</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      color: #0f172a;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: white;
      width: 100%;
      max-width: 460px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }

    h2 {
      margin-bottom: 8px;
      color: #1e293b;
    }

    p.sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 20px;
    }

    input[type="password"], input[type="text"] {
      width: 85%;
      padding: 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 12px;
    }

    button.btn-unlock {
      width: 85%;
      padding: 12px;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button.btn-unlock:active {
      background: #15803d;
    }

    .err {
      color: #dc2626;
      font-size: 14px;
      margin-top: 10px;
      font-weight: 500;
    }

    /* QR Grid */
    .qr-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    @media (max-width: 480px) {
      .qr-grid {
        grid-template-columns: 1fr;
      }
    }

    .qr-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
    }

    .qr-card h4 {
      font-size: 14px;
      margin-bottom: 8px;
      color: #334155;
    }

    .qr-card img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }
  </style>
</head>
<body>

<div class="box">
  <!-- लक स्क्रिन -->
  <div id="lockScreen">
    <h2>🔒 QR भुक्तानी लक</h2>
    <p class="sub">QR कोडहरू हेर्न कृपया पासवर्ड राख्नुहोस्:</p>
    
    <input type="text" id="pwdInput" placeholder="पासवर्ड यहाँ लेख्नुहोस्..." autocomplete="off" />
    <br>
    <button class="btn-unlock" onclick="checkPass()">अनलक गर्नुहोस्</button>
    <div id="errorText" class="err"></div>
  </div>

  <!-- पासवर्ड मिलेपछि देखिने भाग -->
  <div id="qrScreen" style="display: none;">
    <h2>✅ भुक्तानी QR कोडहरू</h2>
    <p class="sub">स्क्यान गरी भुक्तानी गर्नुहोस्</p>

    <div class="qr-grid">
      <div class="qr-card">
        <h4>eSewa</h4>
        <img id="img1" alt="eSewa QR">
      </div>
      <div class="qr-card">
        <h4>Fonepay</h4>
        <img id="img2" alt="Fonepay QR">
      </div>
      <div class="qr-card">
        <h4>Khalti</h4>
        <img id="img3" alt="Khalti QR">
      </div>
      <div class="qr-card">
        <h4>Bank Transfer</h4>
        <img id="img4" alt="Bank QR">
      </div>
    </div>
  </div>
</div>

<script>
  function checkPass() {
    var userText = document.getElementById("pwdInput").value;
    var cleanText = userText.trim().toLowerCase(); // स्पेस हटाउने र सानो अक्षर बनाउने
    var err = document.getElementById("errorText");

    if (cleanText === "saru") {
      // फोटोहरू लोड गर्ने
      document.getElementById("img1").src = "esewa.jpg";
      document.getElementById("img2").src = "fonepay.jpg";
      document.getElementById("img3").src = "khalti.jpg";
      document.getElementById("img4").src = "bank.jpg";

      // स्क्रिन फेर्ने
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("qrScreen").style.display = "block";
    } else {
      err.innerText = "गलत पासवर्ड! कृपया फेरि प्रयास गर्नुहोस्।";
    }
  }

  // किबोर्डको Enter थिच्दा सिधै खुल्ने
  document.getElementById("pwdInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      checkPass();
    }
  });
</script>

</body>
</html>
